base_url = "https://pooladkhay.com"
title = "MJ Pooladkhay"
description = "MJ Pooladkhay's personal website"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = true # Keep this false, as it may cause issues with some styles
build_search_index = false # Keep this false, search is temporarily unsupported
generate_feeds = true # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["feed.xml", "rss.xml"] # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
github_alerts = true
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]

nav = [
  { name = "posts", path = "/posts" },
  { name = "tags", path = "/tags" },
  # { name = "about", path = "/about" },
]

# Your info on the home page
name = "MJ Pooladkhay"
# handle = "pooladkhay.com"
bio = "computer programmer; interested in virtualization and the hardware/software boundary."
avatar = "img/avatar.webp"
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/pooladkhay" },
  { name = "Email", icon = "email", url = "mailto:mj@pooladkhay.com" },
]
blog_section_path = "/posts"

back_link_text = "Back" # Text of the back button
color_scheme = "auto" # "auto" | "light" | "dark"

footer_copyright = "© 2024–2026 MJ Pooladkhay"
footer_credits = false # Whether to show "Built with zola and serene" in footer

not_found_error_text = "110010100 - not found"
not_found_recover_text = "← back home"

reaction = false # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right" # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"
